name: Keep backend alive

# Render's free tier spins the service down after ~15 min of no incoming
# requests, and the next request pays a 30-60s cold-start penalty. Pinging
# the health endpoint well inside that window keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://nishant-infratech.onrender.com/api/health)
          echo "Health check returned HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Backend health check failed with status $status"
            exit 1
          fi
